services:
  - type: web
    name: mitm-placement
    env: python
    region: singapore # Closest to India for fast speeds
    buildCommand: "./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/mitm_placement.db # Points to the persistent disk!
      - key: ADMIN_SECRET
        value: MITM@Admin2024
      - key: GROQ_API_KEY
        sync: false # User must enter this in Render dashboard!
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
